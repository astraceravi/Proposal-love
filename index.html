<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Romantic Proposal</title>
    <style>
        /* Global Styles */
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff9a9e, #fecfef, #ffecd2);
            color: #333;
            overflow-x: hidden;
            transition: background 1s ease;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Proposal Page */
        #proposal {
            text-align: center;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            animation: fadeIn 1s ease;
        }

        #proposal h1 {
            font-size: 2.5em;
            color: #e91e63;
            margin-bottom: 20px;
        }

        #proposal p {
            font-size: 1.2em;
            color: #555;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        button {
            padding: 15px 30px;
            font-size: 1.2em;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        #yes-btn {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
        }

        #yes-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }

        #no-btn {
            background: linear-gradient(45deg, #a8e6cf, #dcedc8);
            color: #333;
            transition: all 0.5s ease;
        }

        /* Accepted Page */
        #accepted {
            display: none;
            text-align: center;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            animation: fadeIn 1s ease;
        }

        #accepted h1 {
            font-size: 2.5em;
            color: #e91e63;
            margin-bottom: 20px;
        }

        #accepted p {
            font-size: 1.2em;
            color: #555;
            margin-bottom: 30px;
        }

        /* Photo Slider */
        .slider {
            position: relative;
            width: 100%;
            max-width: 350px;
            margin: 0 auto 30px;
            overflow: hidden;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .slides {
            display: flex;
            transition: transform 0.5s ease;
        }

        .slide {
            min-width: 100%;
            height: 460px;
            background-size: cover;
            background-position: center;
        }

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.8);
            border: none;
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.5em;
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 1);
            transform: translateY(-50%) scale(1.1);
        }

        .prev { left: 10px; }
        .next { right: 10px; }


        audio {
            display: none;
        }

        #heart-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 5;
        }

        .heart {
            position: absolute;
            font-size: 2em;
            animation: float 3s ease-in-out forwards;
        }

        /* Hearts Animation */
        /* .heart {
            position: absolute;
            font-size: 2em;
            color: #ff6b6b;
            animation: float 3s ease-in-out infinite;
            pointer-events: none;
        } */

        /* @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
        }

        /* Animations */
        /* @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        } */


        @keyframes float {
    from { transform: translateY(100vh); opacity: 1; }
    to { transform: translateY(-100px); opacity: 0; }
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

        /* Responsive */
        @media (max-width: 768px) {
            #proposal h1, #accepted h1 { font-size: 2em; }
            .buttons { flex-direction: column; gap: 10px; }
            button { padding: 12px 25px; font-size: 1em; }
            .slider { height: 200px; }
        }
    </style>
</head>
<body>
    <div id="heart-layer"></div>
    <div class="container">
        
        <!-- Proposal Page -->
        <div id="proposal">
            <h1>Will You Be My Forever? 💕</h1>
            <p>My dearest love, you've brought so much joy into my life. Will you make me the happiest by saying yes?</p>
            <div class="buttons">
                <button id="yes-btn">Yes 💖</button>
                <button id="no-btn">No 😅</button>
            </div>
        </div>

        <!-- Accepted Page -->
        <div id="accepted">
            <h1>You Made Me the Happiest Person Alive ❤️</h1>
            <p>Thank you for saying yes! Here's a little album of our memories.</p>
            <div class="slider">
                <div class="slides" id="slides">
                    <div class="slide" style="background-image: url(Media/Images/image.jpeg);"></div>
                    <div class="slide" style="background-image: url(Media/Images/image10.jpeg);"></div>
                    <div class="slide" style="background-image: url(Media/Images/image11.jpeg);"></div>
                    <div class="slide" style="background-image: url(Media/Images/iamge7.jpeg)"></div>
                    <div class="slide" style="background-image: url(Media/Images/image12.jpeg)"></div>
                    <div class="slide" style="background-image: url(Media/Images/image13.jpeg)"></div>
                    <div class="slide" style="background-image: url(Media/Images/image14.jpeg)"></div>
                    <div class="slide" style="background-image: url(Media/Images/image15.jpeg)"></div>
                    <div class="slide" style="background-image: url(Media/Images/imgae1.jpeg)"></div>
                    <div class="slide" style="background-image: url(Media/Images/image3.jpeg)"></div>
                    <div class="slide" style="background-image: url(Media/Images/image4.jpeg)"></div>
                    <div class="slide" style="background-image: url(Media/Images/image5.jpeg)"></div>
                    <div class="slide" style="background-image: url(Media/Images/image8.jpeg)"></div>
                    <div class="slide" style="background-image: url(Media/Images/image6.jpeg)"></div>
                </div>
                <!-- <button class="nav-btn prev" id="prev">&lt;</button> -->
                <!-- <button class="nav-btn next" id="next">&gt;</button> -->
            </div>
        </div>
    </div>

    <!-- Audio for background music (replace with your own MP3) -->
    <audio id="bg-music">
        <source src="Media/Bg Music/Romance like SRK  Mashup  Shah Rukh Khan, Kajol, Madhuri, Karishma, Preity, Juhi, Anushka, Katrina.mp3" type="audio/mp3"> <!-- Placeholder; replace with a romantic track -->
    </audio>

    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        // Elements
        const proposal = document.getElementById('proposal');
        const accepted = document.getElementById('accepted');
        const yesBtn = document.getElementById('yes-btn');
        const noBtn = document.getElementById('no-btn');
        const slides = document.getElementById('slides');
        const prevBtn = document.getElementById('prev');
        const nextBtn = document.getElementById('next');
        const musicBtn = document.getElementById('music-btn');
        const bgMusic = document.getElementById('bg-music');

        let currentSlide = 0;
        const totalSlides = slides.children.length;
        let autoSlideInterval;


    noBtn.addEventListener('mouseenter', () => {
    const buttonRect = noBtn.getBoundingClientRect();

    let newLeft = Math.random() * (window.innerWidth - buttonRect.width - 60);
    let newTop = Math.random() * (window.innerHeight - buttonRect.height - 60);

    // Keep inside viewport
    newLeft = Math.max(0, Math.min(newLeft, window.innerWidth - buttonRect.width));
    newTop = Math.max(0, Math.min(newTop, window.innerHeight - buttonRect.height));

    noBtn.style.position = 'fixed';
    noBtn.style.left = newLeft + 'px';
    noBtn.style.top = newTop + 'px';
});


        // Yes button click
        yesBtn.addEventListener('click', () => {
            proposal.style.display = 'none';
            accepted.style.display = 'block';
            // Confetti
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });
            // Start hearts animation
            startHearts();
            // Start auto-slide
            startAutoSlide();
            bgMusic.play();
        });

        // Slider functions
        function showSlide(index) {
            slides.style.transform = `translateX(-${index * 100}%)`;
        }

        function nextSlide() {
            currentSlide = (currentSlide + 1) % totalSlides;
            showSlide(currentSlide);
        }

        function prevSlide() {
            currentSlide = (currentSlide - 1 + totalSlides) % totalSlides;
            showSlide(currentSlide);
        }

        nextBtn.addEventListener('click', nextSlide);
        prevBtn.addEventListener('click', prevSlide);

        function startAutoSlide() {
            autoSlideInterval = setInterval(nextSlide, 3000);
        }

        function startHearts() {
    const layer = document.getElementById("heart-layer");

    setInterval(() => {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.textContent = "💖";
        heart.style.left = Math.random() * 100 + "vw";
        layer.appendChild(heart);

        setTimeout(() => heart.remove(), 9000);
    }, 500);
}


    </script>
</body>
</html>
